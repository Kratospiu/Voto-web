<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Central Base - Vota y Gana</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(rgba(0, 0, 0, 0.85), rgba(0, 0, 0, 0.95)), 
                        url('https://images.unsplash.com/photo-1639762681485-074b7f938ba0?q=80&w=1000&auto=format&fit=crop') no-repeat center center fixed;
            background-size: cover;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px 15px;
        }

        /* Botones Superiores */
        .top-nav {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 25px;
            width: 100%;
        }

        .top-btn {
            background-color: #00b4d8;
            color: #fff;
            padding: 8px 16px;
            border-radius: 20px;
            text-decoration: none;
            font-size: 13px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 5px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        /* Redes Sociales (Solo WhatsApp y Telegram) */
        .social-icons {
            display: flex;
            gap: 20px;
            margin-bottom: 25px;
        }

        .social-icons img {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            transition: transform 0.2s;
        }

        .social-icons a:hover img {
            transform: scale(1.1);
        }

        /* Tarjeta Principal */
        .card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 25px 20px;
            text-align: center;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        /* Logo Blanco con Círculo Negro */
        .logo-box {
            width: 100px;
            height: 100px;
            background-color: #ffffff;
            border-radius: 12px;
            margin: 0 auto 20px auto;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }

        .circle-icon {
            width: 50px;
            height: 50px;
            border: 10px solid #000000;
            border-radius: 50%;
            box-sizing: border-box;
        }

        h1 {
            font-size: 22px;
            margin-bottom: 12px;
            font-weight: 800;
            line-height: 1.3;
        }

        p.subtitle {
            font-size: 15px;
            color: #dddddd;
            margin-bottom: 25px;
            line-height: 1.4;
        }

        /* Botón Principal Vota */
        .btn-vota {
            display: block;
            background: linear-gradient(90deg, #0072ff, #00c6ff);
            color: #ffffff;
            text-decoration: none;
            padding: 16px;
            border-radius: 30px;
            font-size: 18px;
            font-weight: bold;
            box-shadow: 0 6px 20px rgba(0, 114, 255, 0.4);
            margin-bottom: 30px;
            transition: transform 0.2s;
        }

        .btn-vota:active {
            transform: scale(0.98);
        }

        /* Sección Billeteras */
        .wallets-section h3 {
            font-size: 16px;
            margin-bottom: 15px;
            color: #eeeeee;
        }

        .wallets-container {
            display: flex;
            justify-content: space-around;
            align-items: center;
            margin-top: 15px;
        }

        .wallet-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }

        .wallet-item img {
            width: 48px;
            height: 48px;
            border-radius: 50%;
        }

        .wallet-item span {
            font-size: 12px;
            color: #bbbbbb;
        }
    </style>
</head>
<body>

    <!-- Botones Superiores -->
    <div class="top-nav">
        <a href="https://t.me/CentralBasse" target="_blank" class="top-btn">🚀 Telegram</a>
        <a href="https://worldcoin.org" target="_blank" class="top-btn">🌍 World App</a>
        <a href="https://dexscreener.com" target="_blank" class="top-btn">📈 DEXScreener</a>
    </div>

    <!-- Solo WhatsApp y Telegram -->
    <div class="social-icons">
        <a href="https://chat.whatsapp.com/BUeefuWKGh1KJJ8bBsUosB?s=sh&p=a&mlu=0&amv=0" target="_blank">
            <img src="https://cdn-icons-png.flaticon.com/512/3670/3670051.png" alt="WhatsApp">
        </a>
        <a href="https://t.me/CentralBasse" target="_blank">
            <img src="https://cdn-icons-png.flaticon.com/512/2111/2111646.png" alt="Telegram">
        </a>
    </div>

    <!-- Tarjeta Principal -->
    <div class="card">
        <!-- Logo Blanco con Círculo Negro -->
        <div class="logo-box">
            <div class="circle-icon"></div>
        </div>
        
        <h1>🌎 ¡Hola a todos, bienvenidos a Central Base 🌎</h1>
        <p class="subtitle">Vota por Central Base y gana 10 WDD, 0.04 WLD, 0.02 USD 🎁🎁</p>

        <!-- TU LINK DE VOTO -->
        <a href="https://www.worldrepublic.org/es/govern/parties/4159fef9-6713-4ba6-9596-8b0d74ff4459?ref=3FCER97H" target="_blank" class="btn-vota">
            👉🗳️ VOTAR AHORA 🗳️👈
        </a>

        <!-- Sección Billeteras (SOLO IMÁGENES / SIN LINK) -->
        <div class="wallets-section">
            <h3>💳 Billeteras de retiro 💳</h3>
            <div class="wallets-container">
                <div class="wallet-item">
                    <img src="https://cryptologos.cc/logos/binance-coin-bnb-logo.png" alt="Binance">
                    <span>Binance</span>
                </div>
                <div class="wallet-item">
                    <img src="https://cryptologos.cc/logos/coinbase-coin-base-logo.png" alt="Coinbase">
                    <span>Coinbase</span>
                </div>
                <div class="wallet-item">
                    <img src="https://images.ctfassets.net/3252v2082sc9/6pW0z9Wq1J7jZgX0N8Xb9k/9f1d063a82e9dbf4803914a8bb3c2b1f/Worldcoin_Logo.png" alt="World App">
                    <span>World App</span>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
