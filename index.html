<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Central Base | Votaciones y Premios</title>

    <!-- CÓDIGO DE ADSTERRA -->
    <script src="https://pl30511242.effectivecpmnetwork.com/a9/b7/02/a9b702839ea24597d1cc165d05765a6f.js"></script>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }
        body {
            background: linear-gradient(rgba(0, 0, 0, 0.88), rgba(0, 0, 0, 0.95)), 
                        url('https://images.unsplash.com/photo-1639762681485-074b7f938ba0?q=80&w=1000&auto=format&fit=crop') no-repeat center center fixed;
            background-size: cover;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px 15px;
            position: relative;
        }
        .translate-container {
            margin-bottom: 15px;
            background: rgba(255, 255, 255, 0.08);
            padding: 6px 12px;
            border-radius: 20px;
            backdrop-filter: blur(5px);
        }
        .goog-te-banner-frame.skiptranslate { display: none !important; }
        body { top: 0px !important; }
        .top-nav {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 25px;
            width: 100%;
            max-width: 400px;
        }
        .top-btn {
            background-color: #00b4d8;
            color: #fff;
            padding: 8px 16px;
            border-radius: 20px;
            text-decoration: none;
            font-size: 13px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 5px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 25px 20px;
            text-align: center;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            margin-bottom: 60px;
        }
        .btn-votar {
            display: block;
            width: 100%;
            background: linear-gradient(135deg, #00b4d8, #0077b6);
            color: white;
            padding: 14px;
            border-radius: 12px;
            text-decoration: none;
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 15px;
            box-shadow: 0 4px 15px rgba(0,180,216,0.4);
        }
        .vote-subtitle {
            font-size: 14px;
            color: #e0e0e0;
            line-height: 1.5;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <!-- Navegación superior -->
    <div class="top-nav">
        <a href="https://t.me" target="_blank" class="top-btn">Telegram</a>
        <a href="https://dexscreener.com" target="_blank" class="top-btn">DEXScreener</a>
    </div>

    <!-- Tarjeta Principal -->
    <div class="card">
        <h2 style="margin-bottom: 20px; font-size: 22px;">Portal Oficial</h2>
        
        <!-- Botón de Votar y Texto nuevo -->
        <a href="https://centralbase.org/" target="_blank" class="btn-votar">¡Votar Ahora!</a>
        <p class="vote-subtitle">🌍 Central Base necesita tu voto. Toma 30 segundos y participa por recompensas 🎁🗳️</p>
    </div>

</body>
</html>
