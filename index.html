<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Central Base | Portal Oficial de Votación</title>

    <!-- SCRIPT DE ADSTERRA -->
    <script src="https://pl30511242.effectivecpmnetwork.com/a9/b7/02/a9b702839ea24597d1cc165d05765a6f.js"></script>

    <!-- FUENTE INTER DESDE GOOGLE FONTS -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- HOJA DE ESTILOS CSS EXTENDIDA Y OPTIMIZADA -->
    <style>
        /* ==========================================
           1. CONFIGURACIÓN GENERAL Y RESET
           ========================================== */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: linear-gradient(rgba(0, 0, 0, 0.85), rgba(0, 0, 0, 0.95)), 
                        url('https://images.unsplash.com/photo-1639762681485-074b7f938ba0?q=80&w=1200&auto=format&fit=crop') no-repeat center center fixed;
            background-size: cover;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 30px 15px;
            position: relative;
            overflow-x: hidden;
        }

        /* ==========================================
           2. ESTILOS DEL TRADUCTOR DE GOOGLE
           ========================================== */
        .translate-wrapper {
            width: 100%;
            max-width: 420px;
            display: flex;
            justify-content: center;
            margin-bottom: 20px;
        }

        .translate-container {
            background: rgba(255, 255, 255, 0.08);
            padding: 8px 16px;
            border-radius: 25px;
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .goog-te-banner-frame.skiptranslate { 
            display: none !important; 
        }
        
        body { 
            top: 0px !important; 
        }

        /* ==========================================
           3. BARRA DE NAVEGACIÓN SUPERIOR
           ========================================== */
        .top-nav {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 30px;
            width: 100%;
            max-width: 420px;
        }

        .top-btn {
            background: linear-gradient(135deg, #00b4d8, #0077b6);
            color: #fff;
            padding: 10px 20px;
            border-radius: 25px;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 15px rgba(0, 180, 216, 0.3);
            transition: all 0.3s ease;
        }

        .top-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 180, 216, 0.5);
            background: linear-gradient(135deg, #0096c7, #005f73);
        }

        /* ==========================================
           4. TARJETA PRINCIPAL DEL PORTAL
           ========================================== */
        .card {
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 30px 24px;
            text-align: center;
            max-width: 420px;
            width: 100%;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
            margin-bottom: 40px;
            position: relative;
        }

        .logo-box {
            width: 85px;
            height: 85px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 50%;
            margin: 0 auto 20px auto;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
        }

        .portal-title {
            font-size: 24px;
            font-weight: 800;
            letter-spacing: -0.5px;
            margin-bottom: 20px;
            color: #ffffff;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
        }

        /* ==========================================
           5. BOTÓN DE VOTACIÓN Y TEXTO FACEBOOK
           ========================================== */
        .btn-votar {
            display: block;
            width: 100%;
            background: linear-gradient(135deg, #00b4d8, #0077b6);
            color: white;
            padding: 16px;
            border-radius: 14px;
            text-decoration: none;
            font-size: 19px;
            font-weight: 700;
            margin-bottom: 16px;
            box-shadow: 0 6px 20px rgba(0, 180, 216, 0.4);
            transition: all 0.2s ease;
            letter-spacing: 0.3px;
        }

        .btn-votar:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0, 180, 216, 0.6);
        }

        .btn-votar:active {
            transform: scale(0.98);
        }

        .vote-subtitle {
            font-size: 14px;
            color: #e2e8f0;
            line-height: 1.6;
            margin-top: 12px;
            margin-bottom: 24px;
            font-weight: 400;
            padding: 0 5px;
        }

        /* ==========================================
           6. REPRODUCTOR DE AUDIO PERSONALIZADO
           ========================================== */
        .audio-section-wrapper {
            margin-top: 20px;
            margin-bottom: 25px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 14px;
            border-radius: 16px;
        }

        .audio-label {
            font-size: 12px;
            color: #94a3b8;
            margin-bottom: 8px;
            font-weight: 500;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .audio-player-container {
            width: 100%;
        }

        audio {
            width: 100%;
            height: 38px;
            border-radius: 8px;
        }

        /* ==========================================
           7. SECCIÓN DE BILLETERAS Y RETIROS
           ========================================== */
        .wallet-footer-section {
            margin-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            padding-top: 20px;
        }

        .wallet-grid {
            display: flex;
            justify-content: space-around;
            align-items: center;
            gap: 10px;
        }

        .wallet-item {
            font-size: 13px;
            color: #cbd5e1;
            font-weight: 500;
            background: rgba(255, 255, 255, 0.05);
            padding: 6px 12px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        /* ==========================================
           8. DISEÑO RESPONSIVO Y EXTRAS
           ========================================== */
        @media (max-width: 480px) {
            body {
                padding: 15px 10px;
            }
            .card {
                padding: 22px 16px;
            }
            .portal-title {
                font-size: 22px;
            }
        }
    </style>
</head>
<body>

    <!-- BLOQUE 1: CONTENEDOR DEL TRADUCTOR DE GOOGLE -->
    <div class="translate-wrapper">
        <div class="translate-container" id="google_translate_element"></div>
    </div>

    <!-- BLOQUE 2: BARRA DE NAVEGACIÓN SUPERIOR (REDES) -->
    <div class="top-nav">
        <a href="https://t.me" target="_blank" class="top-btn">
            <span>📢</span> Telegram
        </a>
        <a href="https://dexscreener.com" target="_blank" class="top-btn">
            <span>📊</span> DEXScreener
        </a>
    </div>

    <!-- BLOQUE 3: TARJETA PRINCIPAL DE LA APLICACIÓN -->
    <div class="card">
        
        <!-- Logo o Icono Central -->
        <div class="logo-box">
            <span>🌍</span>
        </div>

        <!-- Título Institucional -->
        <h2 class="portal-title">Central Base</h2>
        
        <!-- Botón Principal de Acción -->
        <a href="https://centralbase.org/" target="_blank" class="btn-votar">¡Votar Ahora!</a>
        
        <!-- Subtítulo optimizado para revisión de Facebook -->
        <p class="vote-subtitle">🌍 Central Base necesita tu voto. Toma 30 segundos y participa por recompensas 🎁🗳️</p>

        <!-- BLOQUE 4: REPRODUCTOR DE AUDIO INTEGRADO -->
        <div class="audio-section-wrapper">
            <div class="audio-label">🎵 Pista Musical Oficial</div>
            <div class="audio-player-container">
                <audio controls loop>
                    <source src="https://www.w3schools.com/html/horse.mp3" type="audio/mpeg">
                    Tu navegador no soporta el elemento de audio.
                </audio>
            </div>
        </div>

        <!-- BLOQUE 5: BILLETERAS Y MÉTODOS DE RETIRO COMPATIBLES -->
        <div class="wallet-footer-section">
            <div class="wallet-grid">
                <span class="wallet-item">💎 Binance</span>
                <span class="wallet-item">🪙 Coinbase</span>
                <span class="wallet-item">🌐 World App</span>
            </div>
        </div>

    </div>

    <!-- BLOQUE 6: SCRIPTS JAVASCRIPT Y CONFIGURACIONES FINALES -->
    <script type="text/javascript">
        // Inicialización del script de traducción automática global
        function googleTranslateElementInit() {
            new google.translate.TranslateElement({
                pageLanguage: 'es', 
                layout: google.translate.TranslateElement.InlineLayout.SIMPLE
            }, 'google_translate_element');
        }
    </script>
    <script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

</body>
</html>
