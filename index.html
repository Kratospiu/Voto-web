<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vota por nosotros</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background: url('AQUI_VA_EL_LINK_DE_TU_IMAGEN') no-repeat center center fixed;
            background-size: cover;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
        }
        .container {
            text-align: center;
            background: rgba(0, 0, 0, 0.6);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            max-width: 90%;
        }
        .btn-votar {
            display: inline-block;
            margin-top: 20px;
            padding: 15px 30px;
            font-size: 18px;
            font-weight: bold;
            color: #fff;
            background-color: #28a745;
            text-decoration: none;
            border-radius: 8px;
            transition: background 0.3s ease;
        }
        .btn-votar:hover {
            background-color: #218838;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>¡Apóyanos con tu Voto!</h1>
        <p>Haz clic en el botón de abajo para registrar tu voto.</p>
        <a href="https://www.worldrepublic.org/es/govern/parties/4159fef9-6713-4ba6-9596-8b0d74ff4459?ref=3FCER97H" class="btn-votar" target="_blank">VOTAR AQUÍ</a>
    </div>
</body>
</html>
